# Media VM — Core automation pipeline (Chapter 2C)
#
# Services: VPN (ExpressVPN) → qBittorrent (via VPN) → Sonarr, Radarr, Prowlarr, FlareSolverr
# Storage: Single media root (e.g. /mnt/media) so downloads and library share one filesystem
#         for hardlinks and seeding. See docs/Chapter2c-media.md.
#
# Paths: Set MEDIA_ROOT and CONFIG_ROOT via .env or override here.
#        Defaults assume MEDIA_ROOT=/mnt/media and config next to this file.

services:
  # --- VPN (ExpressVPN) — Torrent traffic must exit through VPN only ---
  # qBittorrent attaches via network_mode: service:vpn and shares this container's network.
  # Image: https://github.com/Misioslav/expressvpn
  # Docker Hub: https://hub.docker.com/r/misioslav/expressvpn
  vpn:
    image: misioslav/expressvpn:${EXPRESSVPN_TAG:-latest}
    container_name: vpn
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    devices:
      - /dev/net/tun:/dev/net/tun
    # Ports exposed on the VPN container are used by qBittorrent (network_mode: service:vpn).
    # 8080 = qBittorrent Web UI, 6881 = BitTorrent TCP/UDP, 9797 = Prometheus metrics.
    ports:
      - "8080:8080/tcp"   # qBittorrent Web UI
      - "6881:6881/tcp"   # BitTorrent
      - "6881:6881/udp"   # BitTorrent
      - "9797:9797/tcp"   # ExpressVPN Prometheus metrics
    environment:
      - TZ=${TZ:-Etc/UTC}
      - CODE=${EXPRESSVPN_CODE}
      - SERVER=${EXPRESSVPN_SERVER:-smart}
      - PROTOCOL=${EXPRESSVPN_PROTOCOL:-lightwayudp}
      - ALLOW_LAN=${EXPRESSVPN_ALLOW_LAN:-true}
      - LAN_CIDR=${EXPRESSVPN_LAN_CIDR:-}
      - METRICS_PROMETHEUS=on
      - METRICS_PORT=9797
      - METRICS_PATH=/metrics.cgi
    # Override the image's baked-in healthcheck: it's a DNS-leak test that requires DDNS/IP
    # to be set to do anything, and no-ops to "healthy" otherwise. It does NOT check whether
    # the tunnel is actually up, so it never caught a real multi-week outage where the
    # container's own supervision loop got stuck retrying without ever succeeding (a bug in
    # the image's start.sh: it resets its internal failure counter after every attempt,
    # whether or not the reconnect actually worked, so its own give-up threshold never fires).
    # This checks the one thing that actually matters: does tun0 exist.
    healthcheck:
      test: ["CMD-SHELL", "test -d /sys/class/net/tun0"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 60s
    # autoheal (below) restarts this container if the healthcheck above fails for
    # ~2 minutes straight, so a wedged reconnect loop no longer requires a manual restart.
    labels:
      - "autoheal=true"
    restart: unless-stopped

  # --- qBittorrent — Torrent client (all traffic via VPN) ---
  # Uses the VPN container's network stack so all torrent traffic is routed through VPN.
  # LinuxServer image: https://docs.linuxserver.io/images/docker-qbittorrent
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:${QBITTORRENT_TAG:-latest}
    container_name: qbittorrent
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      # Web UI and torrent ports must match what the vpn service exposes (see vpn.ports).
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ${CONFIG_ROOT:-./config}/qbittorrent:/config
      # Single-root mapping: all media apps see /data so no remote path mapping is needed.
      # qBittorrent UI paths should be under /data/downloads/qbittorrent.
      - ${MEDIA_ROOT:-/mnt/media}:/data
    # network_mode: service:vpn means this container's network namespace is only valid for
    # as long as the *same* vpn container instance is running. If vpn ever restarts (manually,
    # or via autoheal below), this container keeps running but is left attached to a dead
    # namespace — no interfaces, no connectivity — until it is itself restarted.
    # IMPORTANT: this cannot be checked via "curl localhost:8080" — qBittorrent's own process
    # never notices the namespace died, because loopback keeps working regardless of whether
    # the shared eth0/tun0 interfaces are still attached (verified: curl-based check reported
    # "healthy" for 3+ minutes on a namespace that had already lost every interface but lo).
    # Checking for eth0 directly is the actual signal: it exists in any live namespace this
    # container is genuinely attached to, and is absent once orphaned.
    healthcheck:
      test: ["CMD-SHELL", "test -d /sys/class/net/eth0"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 30s
    labels:
      - "autoheal=true"
    restart: unless-stopped

  # --- Autoheal — restarts vpn/qbittorrent automatically on healthcheck failure ---
  # Docker's restart policies only trigger when a container's main process exits; a
  # container that stays "up" but fails its healthcheck (a wedged VPN reconnect loop, a
  # qBittorrent left on a stale network namespace after vpn restarts) is not restarted by
  # Docker on its own. Autoheal watches for that and restarts the affected container.
  # Scoped to only the two labeled services above (AUTOHEAL_CONTAINER_LABEL=autoheal) —
  # it does not touch sonarr/radarr/prowlarr/etc.
  # Image: https://github.com/willfarrell/docker-autoheal
  autoheal:
    image: willfarrell/autoheal:${AUTOHEAL_TAG:-latest}
    container_name: autoheal
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # --- Sonarr — TV automation ---
  # LinuxServer: https://docs.linuxserver.io/images/docker-sonarr
  # Servarr Docker guide: https://wiki.servarr.com/docker-guide
  sonarr:
    image: lscr.io/linuxserver/sonarr:${SONARR_TAG:-latest}
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./config}/sonarr:/config
      # Sonarr sees both downloads and library under /data for direct imports/hardlinks.
      - ${MEDIA_ROOT:-/mnt/media}:/data
    ports:
      - "8989:8989"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # --- Radarr — Movie automation ---
  # LinuxServer: https://docs.linuxserver.io/images/docker-radarr
  radarr:
    image: lscr.io/linuxserver/radarr:${RADARR_TAG:-latest}
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./config}/radarr:/config
      # Radarr follows the same /data path model as Sonarr and download clients.
      - ${MEDIA_ROOT:-/mnt/media}:/data
    ports:
      - "7878:7878"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # --- Prowlarr — Indexer management for Sonarr/Radarr ---
  # No media volumes; only config. Sync indexers to *arrs via Prowlarr UI.
  # LinuxServer: https://docs.linuxserver.io/images/docker-prowlarr
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:${PROWLARR_TAG:-latest}
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./config}/prowlarr:/config
    ports:
      - "9696:9696"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9696/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # --- FlareSolverr — Anti-bot / Cloudflare bypass for protected indexers ---
  # Prowlarr (or indexers) can use this to solve challenges. Not required for all setups.
  # https://github.com/FlareSolverr/FlareSolverr
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:${FLARESOLVERR_TAG:-latest}
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL:-info}
      # - LOG_FILE=/config/log.txt  # optional; omit or set to "none" for stdout only
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./config}/flaresolverr:/config
    ports:
      - "8191:8191"
    restart: unless-stopped
