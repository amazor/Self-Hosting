# Buildarr configuration for the media stack.
# Copy to config/buildarr/buildarr.yml (bootstrap does this when ENABLE_BUILDARR_RECYCLARR=1).
# Configures Sonarr, Radarr, Prowlarr declaratively: root folders, download clients, app sync, FlareSolverr.
# API keys are auto-populated by bootstrap from the pre-seeded config.xml keys.
# Schema: https://buildarr.github.io/configuration/  TRaSH: https://trash-guides.info/

---
buildarr:
  watch_config: false
  update_days: ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"]
  update_times: ["03:00"]

# --- Sonarr ---
sonarr:
  hostname: "sonarr"
  port: 8989
  protocol: "http"
  api_key: "YOUR_SONARR_API_KEY"
  settings:
    media_management:
      rename_episodes: true
      replace_illegal_characters: true
      standard_episode_format: "{Series TitleYear} - S{season:00}E{episode:00} - {Episode CleanTitle} [{Custom Formats}{Quality Full}]{[MediaInfo VideoDynamicRangeType]}{[Mediainfo AudioCodec}{ Mediainfo AudioChannels]}{[MediaInfo VideoCodec]}{-Release Group}"
      daily_episode_format: "{Series TitleYear} - {Air-Date} - {Episode CleanTitle} [{Custom Formats}{Quality Full}]{[MediaInfo VideoDynamicRangeType]}{[Mediainfo AudioCodec}{ Mediainfo AudioChannels]}{[MediaInfo VideoCodec]}{-Release Group}"
      anime_episode_format: "{Series TitleYear} - S{season:00}E{episode:00} - {absolute:000} - {Episode CleanTitle} [{Custom Formats}{Quality Full}]{[MediaInfo VideoDynamicRangeType]}{[Mediainfo AudioCodec}{ Mediainfo AudioChannels]}{[MediaInfo VideoCodec]}{-Release Group}"
      series_folder_format: "{Series TitleYear} [tvdbid-{TvdbId}]"
      season_folder_format: "Season {season:00}"
      multi_episode_style: "prefixed-range"
    root_folders:
      - path: "/data/library/tv"
      - path: "/data/library/anime"
    download_clients:
      definitions:
        qBittorrent:
          type: "qbittorrent"
          enable: true
          host: "qbittorrent"
          port: 8080
          category: "tv"
          recent_priority: "last"
          older_priority: "last"
          initial_state: "start"

# --- Radarr ---
radarr:
  hostname: "radarr"
  port: 7878
  protocol: "http"
  api_key: "YOUR_RADARR_API_KEY"
  settings:
    media_management:
      rename_movies: true
      replace_illegal_characters: true
      standard_movie_format: "{Movie CleanTitle} {(Release Year)} {edition-{Edition Tags}} [{Custom Formats}{Quality Full}]{[MediaInfo VideoDynamicRangeType]}{[Mediainfo AudioCodec}{ Mediainfo AudioChannels]}{[MediaInfo VideoCodec]}{-Release Group}"
      movie_folder_format: "{Movie CleanTitle} ({Release Year}) [tmdbid-{TmdbId}]"
    root_folders:
      - path: "/data/library/movies"
    download_clients:
      definitions:
        qBittorrent:
          type: "qbittorrent"
          enable: true
          host: "qbittorrent"
          port: 8080
          category: "movies"
          recent_priority: "last"
          older_priority: "last"
          initial_state: "start"

# --- Prowlarr ---
# Manages indexer sync to Sonarr/Radarr and FlareSolverr proxy.
# Indexers themselves are added via the setup_media_apps.py post-deploy script (API).
prowlarr:
  hostname: "prowlarr"
  port: 9696
  protocol: "http"
  api_key: "YOUR_PROWLARR_API_KEY"
  settings:
    indexers:
      proxies:
        definitions:
          FlareSolverr:
            type: "flaresolverr"
            host_url: "http://flaresolverr:8191"
            request_timeout: 60
            tags:
              - "flaresolverr"
    apps:
      applications:
        definitions:
          Sonarr:
            type: "sonarr"
            prowlarr_url: "http://prowlarr:9696"
            base_url: "http://sonarr:8989"
            api_key: "YOUR_SONARR_API_KEY"
            sync_level: "add-and-remove-only"
            sync_categories:
              - "tv/web-dl"
              - "tv/foreign"
              - "tv/sd"
              - "tv/hd"
              - "tv/uhd"
              - "tv/other"
            anime_sync_categories:
              - "tv/anime"
          Radarr:
            type: "radarr"
            prowlarr_url: "http://prowlarr:9696"
            base_url: "http://radarr:7878"
            api_key: "YOUR_RADARR_API_KEY"
            sync_level: "add-and-remove-only"
            sync_categories:
              - "movies/foreign"
              - "movies/other"
              - "movies/sd"
              - "movies/hd"
              - "movies/uhd"
              - "movies/bluray"
              - "movies/3d"
              - "movies/dvd"
              - "movies/web-dl"
