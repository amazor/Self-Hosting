# Buildarr example configuration for the media stack (Chapter 2C / 3C).
# Copy to config/buildarr/buildarr.yml (bootstrap can do this when ENABLE_BUILDARR_RECYCLARR=1).
# Aligns with TRaSH Guides and this repo's single-root path layout: /data = MEDIA_ROOT in containers.
# Replace YOUR_* placeholders with real values (API keys from each app: Settings -> General -> Security).
# Schema may vary by Buildarr version — see https://buildarr.github.io/configuration/ and plugin docs.
# TRaSH: https://trash-guides.info/
#
# Workflow: First-time setup — start with this example (or minimal settings), configure apps in UI
# and/or add to YAML as you go. Once happy, dump config from each *arr and save under config/buildarr/
# (or version-control a copy). On VM rebuild, restore that saved buildarr.yml so the stack comes back
# from a known state (cattle, not pets). You can also sanitize a saved config (remove API keys, secrets,
# replace with YOUR_* placeholders) and contribute it as an example so others can copy your exact setup.

---
buildarr:
  watch_config: false
  update_days: ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"]
  update_times: ["03:00"]

# Sonarr — hostname must match compose service name for same-network API access
sonarr:
  hostname: "sonarr"
  port: 8989
  protocol: "http"
  api_key: "YOUR_SONARR_API_KEY"
  settings:
    # Root folders: same paths as in Chapter 3c (single root /data)
    root_folders:
      - path: "/data/library/tv"
      - path: "/data/library/anime"
    # Download clients: qBittorrent (and optionally SABnzbd) with categories from TRaSH layout
    download_clients:
      definitions:
        qBittorrent:
          type: "qbittorrent"
          enable: true
          host: "qbittorrent"
          port: 8080
          category: "tv"
          recent_priority: 1
          older_priority: 2
          initial_state: "start"
          # url_base: ""  # set if using reverse proxy path
          # username/password if set in qBittorrent

# Radarr
radarr:
  hostname: "radarr"
  port: 7878
  protocol: "http"
  api_key: "YOUR_RADARR_API_KEY"
  settings:
    root_folders:
      - path: "/data/library/movies"
    download_clients:
      definitions:
        qBittorrent:
          type: "qbittorrent"
          enable: true
          host: "qbittorrent"
          port: 8080
          category: "movies"
          recent_priority: 1
          older_priority: 2
          initial_state: "start"

# Prowlarr — indexer manager; add indexers and app sync per TRaSH Prowlarr guide
# Dump current config: buildarr prowlarr dump-config http://prowlarr:9696 (paste API key when prompted)
# Docs: https://buildarr.github.io/plugins/prowlarr/
prowlarr:
  hostname: "prowlarr"
  port: 9696
  protocol: "http"
  api_key: "YOUR_PROWLARR_API_KEY"
  settings:
    # Apps: sync indexers to Sonarr/Radarr (TRaSH: Settings -> Apps). Use instance_name to link
    # Buildarr-defined instances (then api_key can be omitted); or set api_key per app and omit instance_name.
    # Single-instance Buildarr often uses instance name "default" — if link fails, try that or set api_key.
    apps:
      applications:
        definitions:
          Sonarr:
            type: "sonarr"
            instance_name: "default"  # or "Sonarr" if you use sonarr.instances."Sonarr"; else set api_key
            prowlarr_url: "http://prowlarr:9696"
            base_url: "http://sonarr:8989"
            sync_level: "add-and-remove-only"  # full-sync | add-and-remove-only | disable
            sync_categories: ["tv/web-dl", "tv/foreign", "tv/sd", "tv/hd", "tv/uhd", "tv/other"]
            anime_sync_categories: ["tv/anime"]
            # tags: []
          Radarr:
            type: "radarr"
            instance_name: "default"  # or "Radarr" if you use radarr.instances."Radarr"; else set api_key
            prowlarr_url: "http://prowlarr:9696"
            base_url: "http://radarr:7878"
            sync_level: "add-and-remove-only"
            sync_categories: ["movies/foreign", "movies/other", "movies/sd", "movies/hd", "movies/uhd", "movies/bluray", "movies/3d", "movies/dvd", "movies/web-dl"]
            # tags: []
    # Optional: general (instance name, backup, analytics), indexers, proxies, tags, ui — add after dump or from docs
    # general:
    #   host:
    #     instance_name: "Prowlarr"
    #   backup:
    #     interval: 7
    #     retention: 28
