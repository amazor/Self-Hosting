# Media VM — Prometheus exporters for pipeline visibility
#
# Provides metrics for D04 Media Pipeline dashboard.
# Enable via ENABLE_EXPORTERS=1 in .env (default: 0; .env.example sets 1).
#
# Services:
#   - scraparr: Prometheus exporter for Sonarr, Radarr, Prowlarr, Bazarr
#     Metrics: queue depth, library size, missing content, indexer health
#     Port: 7100 → Prometheus scrapes this
#     Docs: https://github.com/thecfu/scraparr
#
#   - qbittorrent-exporter: Prometheus exporter for qBittorrent
#     Metrics: download/upload speed, torrent states, ratios, stalled detection
#     Port: 17871 → Prometheus scrapes this
#     Docs: https://github.com/martabal/qbittorrent-exporter
#
# Note: Plex/Jellyfin metrics are handled separately on the accelerated VM.
#   See: https://github.com/jsclayton/prometheus-plex-exporter
#
# Configuration:
#   scraparr reads config from /scraparr/config/config.yaml (mounted volume)
#   OR from environment variables (SONARR_URL, SONARR_API_KEY, etc.)
#
#   qbittorrent-exporter connects to qBittorrent's Web API.
#   qBittorrent runs on the VPN container's network (network_mode: service:vpn)
#   so the exporter must reach it via the VPN container's address.

services:
  # --- scraparr: *arr suite metrics exporter ---
  # Single container exports metrics for all configured *arr services.
  # API keys are generated by each *arr service on first start —
  # retrieve from Settings → General → API Key in each app's UI.
  scraparr:
    image: ghcr.io/thecfu/scraparr:${SCRAPARR_TAG:-latest}
    container_name: scraparr
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
      prowlarr:
        condition: service_healthy
    volumes:
      - ${CONFIG_ROOT:-./config}/scraparr:/scraparr/config
    ports:
      - "7100:7100"
    environment:
      - TZ=${TZ:-Etc/UTC}
      # Environment variable config (alternative to config.yaml).
      # These are used when config.yaml doesn't exist or is empty.
      - SONARR_URL=http://sonarr:8989
      - SONARR_API_KEY=${SONARR_API_KEY:-}
      - RADARR_URL=http://radarr:7878
      - RADARR_API_KEY=${RADARR_API_KEY:-}
      - PROWLARR_URL=http://prowlarr:9696
      - PROWLARR_API_KEY=${PROWLARR_API_KEY:-}
    restart: unless-stopped

  # --- qbittorrent-exporter: download client metrics ---
  # Connects to qBittorrent's Web API to export torrent stats.
  # qBittorrent uses network_mode: service:vpn, so reach it at vpn:8080.
  # Docs: https://github.com/martabal/qbittorrent-exporter
  qbittorrent-exporter:
    image: martabal/qbittorrent-exporter:${QBITTORRENT_EXPORTER_TAG:-latest}
    container_name: qbittorrent-exporter
    depends_on:
      vpn:
        condition: service_started
    environment:
      - QBITTORRENT_BASE_URL=http://vpn:8080
      - QBITTORRENT_USERNAME=${QBITTORRENT_USERNAME:-admin}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD:-adminadmin}
      - EXPORTER_PORT=17871
    ports:
      - "17871:17871"
    restart: unless-stopped
