# Recyclarr configuration for the media stack (v8 format).
# Copy to config/recyclarr/recyclarr.yml (bootstrap copies this when ENABLE_RECYCLARR=1).
# Syncs TRaSH Guide quality definitions, custom formats, quality profiles, and naming to Sonarr/Radarr.
# API keys are in config/recyclarr/secrets.yml (bootstrap auto-populates from pre-seeded config.xml keys).
# Ref: https://recyclarr.dev/reference/config-examples/  https://trash-guides.info/Guide-Sync/
#
# Quality strategy: grab best available now, upgrade to 4K/UHD when it becomes available.
#   - Sonarr: WEB-2160p (Combined) — TRaSH-native combined profile; grabs WEB-1080p as
#             fallback, upgrades to WEB-2160p when available.
#   - Radarr: UHD Bluray + WEB — targets Bluray-2160p; qualities list extended with 1080p
#             fallback so Radarr grabs Bluray-1080p/WEB-1080p when no 4K exists yet.
#   - Anime:  Remux-1080p (anime rarely has 4K; separate profile keeps it clean).
#
# Golden Rule UHD: blocks x265 encodes that lack HDR/DV (4K SDR encodes are pointless).
# Seeker (Cleanuparr) + RSS in Sonarr/Radarr handle the automatic upgrade trigger.

# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json

sonarr:
  # TV and anime share ONE Sonarr instance, so they must live in ONE config block.
  # Recyclarr rejects two blocks pointing at the same base_url ("Split Instances"
  # configuration error) and then syncs neither — a single block with both quality
  # profiles is the supported way to cover both libraries.
  #
  # quality_definition is instance-global in Sonarr, so a shared instance can only
  # have one. "series" wins over "anime" here because the TV library is the bulk of
  # it; the anime *quality profile* below is what actually governs anime grabs.
  main:
    base_url: !secret sonarr_url
    api_key: !secret sonarr_apikey
    quality_definition:
      type: series
    quality_profiles:
      # --- TV (WEB-2160p Combined) — grab 1080p now, upgrade to 4K when available ---
      # TRaSH-native combined profile: WEB-1080p as fallback, WEB-2160p as cutoff/target.
      # https://trash-guides.info/Sonarr/sonarr-setup-quality-profiles/#web-2160p
      - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7  # WEB-2160p (Combined)
        reset_unmatched_scores:
          enabled: true

      # --- Anime — TRaSH Anime quality profile ---
      # Carries minFormatScore 100 plus VOSTFR / Anime LQ Groups at -10000, which is
      # what keeps non-English fansub releases from being grabbed.
      # https://trash-guides.info/Sonarr/sonarr-setup-quality-profiles-anime/#quality-profile
      - trash_id: 20e0fc959f1f1704bed501f23bdae76f  # [Anime] Remux-1080p
        reset_unmatched_scores:
          enabled: true

      # --- HD Bluray + WEB — the everyday default for TV ---
      # This is what most series should use, and what replaces Sonarr's stock "Any".
      #
      # "Any" is not a neutral default, it is a bad one: it allows SDTV, DVD and 480p,
      # and it scores ZERO custom formats — so none of the TRaSH scoring in this file
      # applies to it and a 480p DVD rip is a perfectly valid grab. The custom formats
      # only do their job inside a profile that actually carries their scores.
      #
      # Built from TRaSH's WEB-1080p for its custom-format SCORES, but with the quality
      # list overridden. TRaSH's WEB-1080p is WEB-only (no Bluray, no 720p at all), which
      # is too strict for a general library and leaves older series unfillable. Sonarr has
      # no TRaSH-native "HD Bluray + WEB" the way Radarr does, so we assemble the
      # equivalent here. Floor is 720p — nothing below it is allowed at all.
      - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p (adopted for its CF scores)
        name: HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: WEB 1080p
          until_score: 10000
        # Floor for "is this release acceptable at all". Anything scoring below this is
        # REJECTED OUTRIGHT, not merely ranked lower — TRaSH's default of 0 means every
        # negative format is a hard block, so a show that only exists as x265 is never
        # grabbed and sits missing forever.
        #
        # -500 splits the difference: it is below the x265/AV1 penalty (-300, set in
        # custom_formats below) so those become an eligible LAST RESORT, but far above
        # the -10000 given to LQ, BR-DISK, Upscaled, Bad Dual Groups and
        # "Language: Not Original", which stay permanently blocked.
        min_format_score: -500
        qualities:
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: HDTV-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
          - name: HDTV-720p
    custom_format_groups:
      add:
        # Golden Rule UHD: blocks x265 encodes with no HDR/DV (SDR 4K is not an upgrade).
        # x265 (no HDR/DV) is a default member of the group, so no explicit select is
        # needed — Recyclarr warns that selecting it is redundant.
        - trash_id: e3f37512790f00d0e89e54fe5e790d1c  # [Required] Golden Rule UHD
        - trash_id: 35fb4585dcd9e2a5ac732e4309f5a45a  # [Streaming Services] Asian
    custom_formats:
      # x265/AV1 as a LAST RESORT on the everyday HD profile only.
      #
      # These codecs are not "bad" — they are more efficient than x264. They are
      # penalised because of what a 1080p x265/AV1 release usually IS: a re-encode of an
      # existing x264 rip (lossy from lossy), and a codec many Plex clients cannot direct
      # play, which forces a real-time GPU/CPU transcode on every playback.
      #
      # But at TRaSH's default of -10000 they are a HARD BLOCK, so anything that exists
      # only as x265 is never grabbed at all. -300 (against min_format_score: -500 above)
      # makes them eligible while guaranteeing they lose to ANY x264 release — they only
      # ever win when there is genuinely nothing else.
      #
      # Scoped to "HD Bluray + WEB" ONLY. The 4K and anime profiles keep the -10000 hard
      # block: at 2160p, x265 IS the source format, so an SDR x265 4K encode is pure
      # compatibility cost with no benefit (that is the Golden Rule above).
      - trash_ids:
          - 47435ece6b99a0b477caf360e79ba0bb  # x265 (HD)
          - 15a05bc7c1a36e2b57fd628f8977e2fc  # AV1
        assign_scores_to:
          - name: HD Bluray + WEB
            score: -300

radarr:
  # --- Movies (UHD Bluray + WEB) — grab 1080p now, upgrade to 4K when available ---
  # Base profile: UHD Bluray + WEB (targets Bluray-2160p and WEB-2160p).
  # Quality list extended with Bluray-1080p and WEB-1080p below 2160p as fallback.
  # Radarr grabs the highest available; upgrades to Bluray-2160p when it appears.
  # https://trash-guides.info/Radarr/radarr-setup-quality-profiles/#uhd-bluray-web
  movies:
    base_url: !secret radarr_url
    api_key: !secret radarr_apikey
    quality_definition:
      type: movie
    quality_profiles:
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f  # UHD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-2160p
          until_score: 10000
        # Override quality list to add 1080p below 2160p as fallback.
        # Without this, UHD Bluray + WEB only accepts 2160p and will wait indefinitely.
        qualities:
          - name: Bluray-2160p
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p

      # --- HD Bluray + WEB — the everyday default for movies ---
      # TRaSH-native, used as-is: Bluray-1080p, WEB 1080p, Bluray-720p. Nothing below
      # 720p, no 2160p, and no 30-90GB remuxes. This is what most movies should use.
      #
      # It replaces Radarr's stock "Any", which is actively dangerous rather than merely
      # loose: "Any" allows WORKPRINT, CAM, TELESYNC, TELECINE, DVDSCR and BR-DISK, and
      # scores ZERO custom formats. A cam rip is a legal grab under it, and none of the
      # TRaSH scoring below applies. The negative scores this profile DOES carry are
      # precisely what auto-reject cam rips, foreign dubs and bad encoders.
      # https://trash-guides.info/Radarr/radarr-setup-quality-profiles/#hd-bluray-web
      - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-1080p
          until_score: 10000
        # See the Sonarr profile above for the full reasoning. Short version: TRaSH's
        # default floor of 0 makes every negative custom format a HARD BLOCK, so a movie
        # that only exists as x265 is never grabbed at all. -500 sits below the x265/AV1
        # penalty (-300) so they become a last resort, but well above the -10000 on LQ,
        # BR-DISK, CAM/TELESYNC, Upscaled and Line/Mic Dubbed, which stay blocked.
        min_format_score: -500
    custom_format_groups:
      add:
        # Golden Rule UHD: blocks x265 encodes with no HDR/DV (SDR 4K is not an upgrade).
        - trash_id: ff204bbcecdd487d1cefcefdbf0c278d  # [Required] Golden Rule UHD
    custom_formats:
      # x265/AV1 as a LAST RESORT — HD profile ONLY. See the Sonarr block above.
      # "UHD Bluray + WEB" is deliberately NOT listed here: at 2160p, x265 IS the source
      # format, and an SDR x265 4K encode is all compatibility cost with no benefit, so
      # the Golden Rule -10000 hard block must stay in force there.
      - trash_ids:
          - dc98083864ea246d05a42df0d05f81cc  # x265 (HD)
          - cae4ca30163749b891686f95532519bd  # AV1
        assign_scores_to:
          - name: HD Bluray + WEB
            score: -300
