# Recyclarr configuration for the media stack.
# Copy to config/recyclarr/recyclarr.yml (bootstrap does this when ENABLE_BUILDARR_RECYCLARR=1).
# Syncs TRaSH Guide quality definitions, custom formats, quality profiles, and naming to Sonarr/Radarr.
# API keys are in config/recyclarr/secrets.yml (bootstrap auto-populates from pre-seeded config.xml keys).
# Ref: https://recyclarr.dev/reference/config-examples/  https://trash-guides.info/Guide-Sync/

# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/master/schemas/config-schema.json

sonarr:
  # --- TV (WEB-1080p) — TRaSH Golden Rule: 720/1080p → x264 ---
  tv:
    base_url: "!secret sonarr_url"
    api_key: "!secret sonarr_apikey"
    delete_old_custom_formats: true
    replace_existing_custom_formats: true
    include:
      - template: sonarr-quality-definition-series
      - template: sonarr-v4-quality-profile-web-1080p
      - template: sonarr-v4-custom-formats-web-1080p

  # --- Anime — TRaSH Anime quality profile ---
  # Ref: https://trash-guides.info/Sonarr/sonarr-setup-quality-profiles-anime/
  anime:
    base_url: "!secret sonarr_url"
    api_key: "!secret sonarr_apikey"
    delete_old_custom_formats: true
    replace_existing_custom_formats: true
    include:
      - template: sonarr-quality-definition-anime
      - template: sonarr-v4-quality-profile-anime
      - template: sonarr-v4-custom-formats-anime

radarr:
  # --- Movies (HD Bluray + WEB 1080p) — TRaSH Golden Rule ---
  # Ref: https://trash-guides.info/Radarr/
  movies:
    base_url: "!secret radarr_url"
    api_key: "!secret radarr_apikey"
    delete_old_custom_formats: true
    replace_existing_custom_formats: true
    include:
      - template: radarr-quality-definition-movie
      - template: radarr-quality-profile-hd-bluray-web
      - template: radarr-custom-formats-hd-bluray-web
