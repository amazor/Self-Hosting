# Recyclarr secrets — copy to config/recyclarr/secrets.yml and fill in.
# Do not commit secrets.yml. API keys: Sonarr/Radarr Settings -> General -> Security.
# Base URLs must be reachable from the Recyclarr container (Docker service names).

sonarr_url: "http://sonarr:8989"
sonarr_apikey: "YOUR_SONARR_API_KEY"

radarr_url: "http://radarr:7878"
radarr_apikey: "YOUR_RADARR_API_KEY"
