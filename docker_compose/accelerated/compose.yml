# Accelerated VM — Plex + Immich (Chapter 2D / 3D)
#
# Services:
#   - plex               — Media server reading /mnt/media/library (from Media VM)
#   - immich-server      — Immich API + backend (includes microservices since v1.106)
#   - immich-machine-learning
#   - immich-postgres    — Postgres DB for Immich (local disk, no network shares)
#   - immich-redis       — Redis for Immich
#
# Storage:
#   - MEDIA_LIBRARY_ROOT → /data/library  (Plex, read-only)
#   - IMMICH_UPLOAD_ROOT → /data          (Immich originals/derived; matches IMMICH_MEDIA_LOCATION default)
#   - IMMICH_DB_ROOT     → /var/lib/postgresql/data (local disk, not NFS)
#
# GPU:
#   - Intel Quick Sync / VAAPI via /dev/dri
#
# Network:
#   - Single internal bridge: accelerated_internal
#   - Host ports: Plex (32400), Immich web/API (2283)

services:
  # --- Plex — Media server (library-only view) ---
  plex:
    image: lscr.io/linuxserver/plex:${PLEX_TAG:-latest}
    container_name: plex
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      # Optional: first-run claim token from plex.tv; leave empty after initial registration.
      - PLEX_CLAIM=${PLEX_CLAIM:-}
    volumes:
      - ${CONFIG_ROOT:-./config}/plex:/config
      # Read-only view of final media library from Media VM.
      - ${MEDIA_LIBRARY_ROOT:-/mnt/media/library}:/data/library:ro
    devices:
      # Intel Quick Sync / VAAPI
      - /dev/dri:/dev/dri
    ports:
      - "32400:32400"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:32400/identity || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - accelerated_internal

  # --- Immich database (Postgres) ---
  # Must use Immich's custom image: includes VectorChord + pgvector extensions required
  # for smart search and face recognition. Vanilla postgres:16-alpine will fail at startup.
  immich-postgres:
    image: ghcr.io/immich-app/postgres:${IMMICH_POSTGRES_TAG:-16-vectorchord0.5.3-pgvector0.8.1}
    container_name: immich-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=immich
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - ${IMMICH_DB_ROOT:-./config/immich-postgres}:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - accelerated_internal

  # --- Immich Redis ---
  immich-redis:
    image: redis:${IMMICH_REDIS_TAG:-7-alpine}
    container_name: immich-redis
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    restart: unless-stopped
    networks:
      - accelerated_internal

  # --- Immich server (API + backend) ---
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v2}
    container_name: immich-server
    depends_on:
      immich-postgres:
        condition: service_healthy
      immich-redis:
        condition: service_started
    environment:
      - DB_HOSTNAME=immich-postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich-redis
      - REDIS_PORT=6379
      - TZ=${TZ:-Etc/UTC}
      - IMMICH_LOG_LEVEL=log
    volumes:
      # IMMICH_MEDIA_LOCATION defaults to /data inside the container.
      - ${IMMICH_UPLOAD_ROOT:-/mnt/photos/library}:/data
    devices:
      # Video transcoding via Intel Quick Sync / VAAPI
      - /dev/dri:/dev/dri
    ports:
      # Immich web/API; Core VM reverse-proxies this.
      - "2283:2283"
    restart: unless-stopped
    networks:
      - accelerated_internal

  # --- Immich machine learning (CPU by default) ---
  # For hardware-accelerated ML inference, append an accel suffix to the image tag
  # (e.g. ${IMMICH_VERSION:-release}-openvino for Intel). See:
  # https://immich.app/docs/features/ml-hardware-acceleration
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v2}
    container_name: immich-machine-learning
    environment:
      - IMMICH_LOG_LEVEL=log
    volumes:
      # Persistent cache for ML models (CLIP, face recognition). Avoids re-download on recreation.
      - ${CONFIG_ROOT:-./config}/immich-ml-cache:/cache
    restart: unless-stopped
    networks:
      - accelerated_internal

networks:
  accelerated_internal:
    driver: bridge
