# Accelerated VM — Plex + Immich (Chapter 2D / 3D)
#
# Services:
#   - plex               — Media server reading /mnt/media/library (from Media VM)
#   - immich-server      — Immich API + backend (includes microservices since v1.106)
#   - immich-machine-learning
#   - immich-postgres    — Postgres DB for Immich (local disk, no network shares)
#   - immich-redis       — Redis for Immich
#
# Storage:
#   - MEDIA_LIBRARY_ROOT → /data/library  (Plex, read-only)
#   - IMMICH_UPLOAD_ROOT → /data          (Immich originals/derived; matches IMMICH_MEDIA_LOCATION default)
#   - IMMICH_DB_ROOT     → /var/lib/postgresql/data (local disk, not NFS)
#
# GPU:
#   - Intel Quick Sync / VAAPI via /dev/dri
#
# Network:
#   - Single internal bridge: accelerated_internal
#   - Host ports: Plex (32400), Immich web/API (2283), iperf3 (5201 tcp+udp)

services:
  # --- Plex — Media server (library-only view) ---
  plex:
    image: lscr.io/linuxserver/plex:${PLEX_TAG:-latest}
    container_name: plex
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      # Optional: first-run claim token from plex.tv; leave empty after initial registration.
      - PLEX_CLAIM=${PLEX_CLAIM:-}
      # Force the iHD (intel-media-driver) VA-API backend for 12th-14th gen Intel QSV.
      # The linuxserver image auto-joins the render/video device groups, so no group_add needed.
      - LIBVA_DRIVER_NAME=iHD
    volumes:
      - ${CONFIG_ROOT:-./config}/plex:/config
      # Read-only view of final media library from Media VM.
      - ${MEDIA_LIBRARY_ROOT:-/mnt/media/library}:/data/library:ro
    devices:
      # Intel Quick Sync / VAAPI
      - /dev/dri:/dev/dri
    ports:
      - "32400:32400"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:32400/identity || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - accelerated_internal

  # --- Immich database (Postgres) ---
  # Must use Immich's custom image: includes VectorChord + pgvector extensions required
  # for smart search and face recognition. Vanilla postgres:16-alpine will fail at startup.
  immich-postgres:
    image: ghcr.io/immich-app/postgres:${IMMICH_POSTGRES_TAG:-16-vectorchord0.5.3-pgvector0.8.1}
    container_name: immich-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=immich
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - ${IMMICH_DB_ROOT:-./config/immich-postgres}:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - accelerated_internal

  # --- Immich Redis ---
  immich-redis:
    image: redis:${IMMICH_REDIS_TAG:-7-alpine}
    container_name: immich-redis
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    restart: unless-stopped
    networks:
      - accelerated_internal

  # --- Immich server (API + backend) ---
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v2}
    container_name: immich-server
    depends_on:
      immich-postgres:
        condition: service_healthy
      immich-redis:
        condition: service_started
    environment:
      - DB_HOSTNAME=immich-postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich-redis
      - REDIS_PORT=6379
      - TZ=${TZ:-Etc/UTC}
      - IMMICH_LOG_LEVEL=log
    volumes:
      # IMMICH_MEDIA_LOCATION defaults to /data inside the container.
      - ${IMMICH_UPLOAD_ROOT:-/mnt/photos/library}:/data
    devices:
      # Video transcoding via Intel Quick Sync / VAAPI
      - /dev/dri:/dev/dri
    ports:
      # Immich web/API; Core VM reverse-proxies this.
      - "2283:2283"
    restart: unless-stopped
    networks:
      - accelerated_internal

  # --- Immich machine learning (CPU by default) ---
  # For hardware-accelerated ML inference, append an accel suffix to the image tag
  # (e.g. ${IMMICH_VERSION:-release}-openvino for Intel). See:
  # https://immich.app/docs/features/ml-hardware-acceleration
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v2}
    container_name: immich-machine-learning
    environment:
      - IMMICH_LOG_LEVEL=log
    volumes:
      # Persistent cache for ML models (CLIP, face recognition). Avoids re-download on recreation.
      - ${CONFIG_ROOT:-./config}/immich-ml-cache:/cache
    restart: unless-stopped
    networks:
      - accelerated_internal

  # --- iperf3: network bandwidth test server ---
  # Image: mm404/iperf3 — Alpine-based, multi-arch, runs as non-root, pinned tags.
  # Lives on this VM (not core) because Plex runs here: an iperf3 test against
  # accelerated traverses the exact router -> VM path that real remote-Plex
  # streaming uses, so it measures the upload bottleneck most representatively.
  #
  # Diagnose remote-Plex throughput: run an iperf3 CLIENT from the remote internet
  # location with -R (reverse) to measure this VM's UPLOAD path (the usual
  # remote-streaming bottleneck), and -u for jitter/packet-loss.
  #
  # NOT HTTP: cannot sit behind Caddy. It needs its own raw TCP+UDP port (5201).
  # The container runs 24/7 but is only reachable from the internet when you
  # MANUALLY enable a router port-forward of TCP+UDP ${IPERF3_PORT} to this VM.
  # iperf3 has NO AUTH — never leave the port-forward open after testing.
  iperf3:
    image: mm404/iperf3:${IPERF3_TAG:-latest}
    container_name: iperf3
    # mm404/iperf3 entrypoint is `iperf3`; these args run it in server mode.
    command: ["-s", "-p", "${IPERF3_PORT:-5201}"]
    ports:
      # Bind to host. Default 0.0.0.0 so the router forward works out of the box;
      # set IPERF3_BIND_IP to the VM LAN IP to restrict which interface listens.
      - "${IPERF3_BIND_IP:-0.0.0.0}:${IPERF3_PORT:-5201}:${IPERF3_PORT:-5201}/tcp"
      - "${IPERF3_BIND_IP:-0.0.0.0}:${IPERF3_PORT:-5201}:${IPERF3_PORT:-5201}/udp"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - accelerated_internal

networks:
  accelerated_internal:
    driver: bridge
