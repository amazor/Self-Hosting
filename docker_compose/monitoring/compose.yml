# Monitoring VM — Observability stack (Chapter 2B)
#
# Services:
#   - Grafana: dashboards + log search (Prometheus + Loki datasources)
#   - Prometheus: metrics store (scrapes exporters on all VMs)
#   - Loki: log aggregation (receives from Alloy agents on all VMs)
#   - Uptime Kuma: uptime checks + alerting
#   - node_exporter: host metrics (CPU, RAM, disk, network) — host network
#   - cAdvisor: per-container metrics (CPU, RAM, restarts)
#   - Alloy: log shipper (Docker container logs → Loki)
#
# Principles:
#   - All data lives on LOCAL disk (no NFS — Prometheus TSDB, Loki TSDB, and
#     Uptime Kuma SQLite all require POSIX-compliant filesystems).
#   - Retention is bounded (default 30d) to keep disk usage predictable.
#   - Losing this VM loses visibility, not functionality.
#   - Services run as non-root where the image supports it; bootstrap sets
#     volume ownership (e.g. Uptime Kuma, Alloy) so we don't need root.
#
# Network:
#   - Most services on monitoring_internal bridge (communicate by container name).
#   - node_exporter uses network_mode: host for accurate host metrics.
#   - Prometheus reaches node_exporter via host.docker.internal.
#
# Paths:
#   Set CONFIG_ROOT and other values in .env (see .env.example).
#   Relative paths are resolved from the directory where you run docker compose.
#
# Docs: docs/Chapter2b-monitoring.md

services:
  # --- Grafana: dashboards + log search ---
  # Single UI for metrics (Prometheus) and logs (Loki). Datasources are
  # auto-provisioned by bootstrap (datasources.yml); no manual setup needed.
  # Docs: https://grafana.com/docs/grafana/latest/setup-grafana/installation/docker/
  grafana:
    image: grafana/grafana:${GRAFANA_TAG:-latest}
    container_name: grafana
    # Official image runs as UID 472 (grafana user). Explicit user = non-root best practice.
    user: "472"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      # Set a strong password in .env; bootstrap rejects placeholder. Default here is fallback only.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      # Set in .env when behind reverse proxy (OAuth redirects, links). localhost default = direct access only.
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-http://localhost:3000}
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./config}/grafana/data:/var/lib/grafana
      - ${CONFIG_ROOT:-./config}/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - monitoring_internal

  # --- Prometheus: metrics store (scrapes exporters) ---
  # Pull model: scrapes node_exporter, cAdvisor, and itself on a schedule.
  # Config at config/prometheus/prometheus.yml is generated by bootstrap.
  # Docs: https://prometheus.io/docs/prometheus/latest/installation/
  prometheus:
    image: prom/prometheus:${PROMETHEUS_TAG:-latest}
    container_name: prometheus
    # nobody (65534) = non-root; official image default. Bootstrap chowns data dir to this UID.
    user: "nobody"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
      - "--web.enable-lifecycle"
    # Required so Prometheus (on bridge) can scrape node_exporter on host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CONFIG_ROOT:-./config}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${CONFIG_ROOT:-./config}/prometheus/data:/prometheus
    ports:
      - "9090:9090"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - monitoring_internal

  # --- Loki: log aggregation (receives from Alloy agents) ---
  # Label-based log store; native Grafana datasource. Port 3100 must be
  # reachable from other VMs if you run Alloy there (push logs to this Loki).
  # Docs: https://grafana.com/docs/loki/latest/setup/install/docker/
  loki:
    image: grafana/loki:${LOKI_TAG:-3}
    container_name: loki
    # UID 10001 = official image non-root user. Bootstrap chowns data dir to this UID.
    user: "10001"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ${CONFIG_ROOT:-./config}/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ${CONFIG_ROOT:-./config}/loki/data:/loki
    ports:
      - "3100:3100"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - monitoring_internal

  # --- Uptime Kuma: uptime checks + alerting ---
  # HTTP/TCP/HTTP(s) keyword checks with built-in notifications. Data is a
  # small SQLite DB — NFS not supported. Run as root so the app can create
  # data/upload/ on any bind mount; caps are dropped and no-new-privileges set.
  # Docs: https://github.com/louislam/uptime-kuma
  uptime-kuma:
    image: louislam/uptime-kuma:${UPTIME_KUMA_TAG:-2}
    container_name: uptime-kuma
    user: "0"
    volumes:
      - ${CONFIG_ROOT:-./config}/uptime-kuma:/app/data
    ports:
      - "3001:3001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - monitoring_internal

  # --- node_exporter: host metrics (CPU, RAM, disk, network) ---
  # Exposes /metrics for the host. Must use host network and PID namespace for
  # accurate CPU and process metrics. Prometheus scrapes via host.docker.internal:9100.
  # Log message "Failed to open directory ... /run/udev/data" is expected in
  # containers; udev device properties are disabled but disk/host metrics still work.
  # Docs: https://github.com/prometheus/node_exporter#docker
  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_TAG:-latest}
    container_name: node-exporter
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /:/host:ro,rslave
    network_mode: host
    pid: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # --- cAdvisor: per-container resource metrics ---
  # CPU, memory, network, disk I/O per container for Prometheus. Requires
  # privileged + host paths on Debian/Ubuntu for cgroup v2 access; no way to
  # avoid privileged for full container metrics.
  # Docs: https://github.com/google/cadvisor
  cadvisor:
    image: ghcr.io/google/cadvisor:${CADVISOR_TAG:-latest}
    container_name: cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - monitoring_internal

  # --- Alloy: log shipper (Docker logs → Loki) ---
  # Replaces Promtail (deprecated, EOL March 2026). Discovers containers via
  # Docker socket, ships stdout/stderr to Loki with labels. Per grafana/alloy-scenarios
  # (docker-monitoring, self-monitoring) Alloy needs Docker socket access; we run
  # without user override so the default image user can read the socket (or set
  # ALLOY_RUN_AS_USER=473 and add that UID to the host's docker group).
  # Bootstrap creates config.alloy and chowns config/alloy/data to Alloy's UID when used.
  # Docs: https://grafana.com/docs/alloy/latest/get-started/install/docker/
  alloy:
    image: grafana/alloy:${ALLOY_TAG:-latest}
    container_name: alloy
    command:
      - run
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - /etc/alloy/config.alloy
    environment:
      - ALLOY_DEPLOY_MODE=docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${CONFIG_ROOT:-./config}/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${CONFIG_ROOT:-./config}/alloy/data:/var/lib/alloy/data
    ports:
      - "12345:12345"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - monitoring_internal

networks:
  monitoring_internal:
    driver: bridge
