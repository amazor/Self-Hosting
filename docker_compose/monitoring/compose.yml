# Monitoring VM — Observability stack (Chapter 2B)
#
# Services:
#   - Grafana: dashboards + log search (Prometheus + Loki datasources)
#   - Prometheus: metrics store (scrapes exporters on all VMs), evaluates
#     alert rules from config/prometheus/rules/
#   - Alertmanager: routes Prometheus alerts to ntfy (compose.ntfy.yml)
#   - Loki: log aggregation (receives from Alloy agents on all VMs)
#   - Blackbox Exporter: network probes (HTTP, TCP, ICMP, DNS)
#   - Uptime Kuma: uptime checks (not currently wired to a notification
#     channel — see docs/Chapter3b-monitoring-stack.md)
#
# Alerting: Prometheus (metrics) -> Alertmanager -> ntfy, and Grafana's own
# unified alerting (one Loki-log-based rule) -> ntfy, both via ntfy's
# webhook templates. See docker_compose/monitoring/alerting/ and
# docs/Chapter3b-monitoring-stack.md for the full design + "why".
#
# Sidecars (node_exporter, cAdvisor, Alloy) live in the shared overlay:
#   compose.observability.yml (symlink → ../common/compose.observability.yml)
#   Enabled via ENABLE_OBSERVABILITY=1 in .env (default: on).
#
# Principles:
#   - All data lives on LOCAL disk (no NFS — Prometheus TSDB, Loki TSDB, and
#     Uptime Kuma SQLite all require POSIX-compliant filesystems).
#   - Retention is bounded (default 30d) to keep disk usage predictable.
#   - Losing this VM loses visibility, not functionality.
#   - Services run as non-root where the image supports it; bootstrap sets
#     volume ownership (e.g. Uptime Kuma) so we don't need root.
#
# Network:
#   - Most services on monitoring_internal bridge (communicate by container name).
#   - Prometheus reaches node_exporter via host.docker.internal.
#
# Paths:
#   Set CONFIG_ROOT and other values in .env (see .env.example).
#   Relative paths are resolved from the directory where you run docker compose.
#
# Docs: docs/Chapter2b-monitoring.md

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # --- Grafana: dashboards + log search ---
  # Single UI for metrics (Prometheus) and logs (Loki). Datasources are
  # auto-provisioned by bootstrap (datasources.yml); no manual setup needed.
  # Docs: https://grafana.com/docs/grafana/latest/setup-grafana/installation/docker/
  grafana:
    image: grafana/grafana:${GRAFANA_TAG:-latest}
    container_name: grafana
    logging: *default-logging
    # Official image runs as UID 472 (grafana user). Explicit user = non-root best practice.
    user: "472"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      # Set a strong password in .env; bootstrap rejects placeholder. Default here is fallback only.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      # Set in .env when behind reverse proxy (OAuth redirects, links). localhost default = direct access only.
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-http://localhost:3000}
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - TZ=${TZ:-Etc/UTC}
      # DEV ONLY (dev/grafana-mcp-tooling branch): wires the grafana-image-renderer
      # sidecar below so grafana-mcp's rendering tools produce real PNGs. Not
      # meant to reach main — remove these vars if this branch's sidecars are cut.
      - GF_RENDERING_SERVER_URL=http://grafana-image-renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      # Grafana refuses to start rendering in production mode with the
      # renderer's default (disabled) auth token — must be set to a real
      # value, matching AUTH_TOKEN on grafana-image-renderer below.
      - GF_RENDERING_RENDERER_TOKEN=${GRAFANA_RENDERER_TOKEN}
    volumes:
      - ${CONFIG_ROOT:-./config}/grafana/data:/var/lib/grafana
      - ${CONFIG_ROOT:-./config}/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - monitoring_internal

  # --- Prometheus: metrics store (scrapes exporters) ---
  # Pull model: scrapes node_exporter, cAdvisor, and itself on a schedule.
  # Config at config/prometheus/prometheus.yml is generated by bootstrap.
  # Docs: https://prometheus.io/docs/prometheus/latest/installation/
  prometheus:
    image: prom/prometheus:${PROMETHEUS_TAG:-latest}
    container_name: prometheus
    logging: *default-logging
    # nobody (65534) = non-root; official image default. Bootstrap chowns data dir to this UID.
    user: "nobody"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    # Required so Prometheus (on bridge) can scrape node_exporter on host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CONFIG_ROOT:-./config}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${CONFIG_ROOT:-./config}/prometheus/targets:/etc/prometheus/targets:ro
      - ${CONFIG_ROOT:-./config}/prometheus/rules:/etc/prometheus/rules:ro
      - ${CONFIG_ROOT:-./config}/prometheus/data:/prometheus
    ports:
      - "9090:9090"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - monitoring_internal

  # --- Alertmanager: routes Prometheus alert rule firings to ntfy ---
  # Prometheus evaluates rules from config/prometheus/rules/ and hands firing
  # alerts to Alertmanager (alerting.alertmanagers in prometheus.yml).
  # Alertmanager's single webhook receiver posts to ntfy (compose.ntfy.yml)
  # using an ntfy webhook template (config/ntfy/templates/alertmanager.yml)
  # since Alertmanager's raw JSON payload has no human-friendly title/message.
  # Docs: https://prometheus.io/docs/alerting/latest/alertmanager/
  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_TAG:-latest}
    container_name: alertmanager
    logging: *default-logging
    # nobody (65534) = non-root; official image default. Bootstrap chowns data dir to this UID.
    user: "nobody"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ${CONFIG_ROOT:-./config}/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${CONFIG_ROOT:-./config}/alertmanager/data:/alertmanager
    ports:
      - "9093:9093"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - monitoring_internal

  # --- Loki: log aggregation (receives from Alloy agents) ---
  # Label-based log store; native Grafana datasource. Port 3100 must be
  # reachable from other VMs if you run Alloy there (push logs to this Loki).
  # Docs: https://grafana.com/docs/loki/latest/setup/install/docker/
  loki:
    image: grafana/loki:${LOKI_TAG:-3}
    container_name: loki
    logging: *default-logging
    # UID 10001 = official image non-root user. Bootstrap chowns data dir to this UID.
    user: "10001"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ${CONFIG_ROOT:-./config}/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ${CONFIG_ROOT:-./config}/loki/data:/loki
    ports:
      - "3100:3100"
    security_opt:
      - no-new-privileges:true
    # Loki v3.6+ image has no wget/curl; use built-in health check (see grafana/loki#20149).
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - monitoring_internal

  # --- Blackbox Exporter: network probe checks ---
  # Probes endpoints via HTTP, HTTPS, TCP, ICMP, DNS on behalf of Prometheus.
  # Prometheus sends probe requests; results become time-series metrics.
  # Targets are managed via file_sd (config/prometheus/targets/blackbox-targets.json).
  # ICMP probes require NET_RAW — added back after dropping ALL.
  # Docs: https://github.com/prometheus/blackbox_exporter
  blackbox-exporter:
    image: prom/blackbox-exporter:${BLACKBOX_TAG:-latest}
    container_name: blackbox-exporter
    logging: *default-logging
    command:
      - "--config.file=/config/blackbox.yml"
    volumes:
      - ${CONFIG_ROOT:-./config}/blackbox-exporter/blackbox.yml:/config/blackbox.yml:ro
    ports:
      - "9115:9115"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    restart: unless-stopped
    networks:
      - monitoring_internal

  # --- Uptime Kuma: uptime checks + alerting ---
  # HTTP/TCP/HTTP(s) keyword checks with built-in notifications. Data is a
  # small SQLite DB — NFS not supported.
  # v2 uses embedded MariaDB which only accepts user "node" (UID 1000) or root.
  # Let the image entrypoint handle user switching; bootstrap chowns config/uptime-kuma.
  # Docs: https://github.com/louislam/uptime-kuma
  uptime-kuma:
    image: louislam/uptime-kuma:${UPTIME_KUMA_TAG:-2}
    container_name: uptime-kuma
    logging: *default-logging
    volumes:
      - ${CONFIG_ROOT:-./config}/uptime-kuma:/app/data
    ports:
      - "3001:3001"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - monitoring_internal

  # ============================================================
  # DEV ONLY — dev/grafana-mcp-tooling branch.
  # Dashboard-design tooling: Grafana MCP server + the image-renderer
  # it needs for PNG rendering. Not meant to reach `main` — this whole
  # block goes away when the branch is discarded/not merged.
  # ============================================================

  # --- Grafana Image Renderer: headless Chromium PNG rendering ---
  # Required for grafana-mcp's rendering tools (and Grafana's own image
  # rendering) to produce actual panel/dashboard PNGs instead of erroring.
  # Docs: https://github.com/grafana/grafana-image-renderer
  grafana-image-renderer:
    image: grafana/grafana-image-renderer:${GRAFANA_RENDERER_TAG:-latest}
    container_name: grafana-image-renderer
    logging: *default-logging
    environment:
      # Must match GF_RENDERING_RENDERER_TOKEN on the grafana service above.
      - AUTH_TOKEN=${GRAFANA_RENDERER_TOKEN}
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - monitoring_internal

  # --- Grafana MCP server ---
  # Lets an MCP client (Claude Code) create/update dashboards and validate
  # PromQL/LogQL queries against this Grafana instance directly, instead of
  # hand-editing dashboard JSON and hoping it's correct.
  # GRAFANA_MCP_API_KEY is a service-account token (Admin role) — see
  # `docs/Chapter3b-monitoring-stack.md` for how it was generated.
  # allowed-hosts/-origins are wide open ("*"/default-reject) since this is a
  # temporary LAN-only dev sidecar behind no reverse proxy — do not expose
  # this port publicly or carry it into `main`.
  # Docs: https://github.com/grafana/mcp-grafana
  grafana-mcp:
    image: mcp/grafana:${GRAFANA_MCP_TAG:-latest}
    container_name: grafana-mcp
    logging: *default-logging
    command:
      - "-t"
      - "streamable-http"
      - "-address"
      - "0.0.0.0:8000"
      - "-allowed-hosts"
      - "*"
    environment:
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_API_KEY=${GRAFANA_MCP_API_KEY}
    ports:
      - "8000:8000"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - monitoring_internal

networks:
  monitoring_internal:
    driver: bridge
