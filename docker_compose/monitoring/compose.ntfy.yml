# Monitoring VM — ntfy (alert notification delivery)
# Use with: docker compose -f compose.yml -f compose.ntfy.yml up -d
# Enabled via ENABLE_NTFY=1 in .env; default is ON here (unlike media's
# opt-in ntfy, this is the delivery path for Alertmanager + Grafana alerting
# — without it, alert rules load and evaluate but nothing reaches a human).
#
# Alertmanager and Grafana both post here as webhook receivers, using ntfy's
# webhook *templates* (config/ntfy/templates/*.yml, mounted below) to turn
# each system's raw JSON into a readable notification. See
# docs/Chapter3b-monitoring-stack.md for why templates over a bridge service.
# Docs: https://docs.ntfy.sh/publish/#publish-using-a-template
#
# Subscribe: ntfy app (iOS/Android/web) -> add server http://<monitoring-ip>:8099
# -> topic from NTFY_ALERT_TOPIC (.env, default "homelab-alerts").

services:
  ntfy:
    image: binwiederhier/ntfy:${NTFY_TAG:-latest}
    container_name: ntfy
    command: ["serve", "--cache-file", "/var/cache/ntfy/cache.db"]
    environment:
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./config}/ntfy/cache:/var/cache/ntfy
      # templates/*.yml generated by bootstrap from docker_compose/monitoring/alerting/ntfy-templates/
      - ${CONFIG_ROOT:-./config}/ntfy:/etc/ntfy:ro
    # Host 8099 to avoid binding 80; matches the media stack's ntfy port.
    ports:
      - "8099:80"
    restart: unless-stopped
    networks:
      - monitoring_internal
