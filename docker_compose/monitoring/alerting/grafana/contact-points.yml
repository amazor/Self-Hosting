# Grafana file-provisioned contact point: ntfy.
#
# Only used by Grafana-managed alert rules (currently: the one Loki
# log-pattern rule in log-alert-rules.yml — Prometheus can't query Loki
# natively, and enabling Loki's own ruler was a bigger lift than reusing
# Grafana's already-present alerting scaffold for one rule).
#
# Grafana's default webhook payload already includes rendered top-level
# "title"/"message" fields, so no ntfy ?template= is used here (verified
# live — see docs/Chapter3b-monitoring-stack.md). If that ever stops
# rendering legibly, add ?template=grafana (template file already exists
# at config/ntfy/templates/grafana.yml).
#
# NOTE: the topic name here must match NTFY_ALERT_TOPIC in .env — this file
# is static (Grafana file-provisioning doesn't expand shell env vars), so if
# you change NTFY_ALERT_TOPIC, update the url below to match.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: ntfy
    receivers:
      - uid: ntfy_webhook
        type: webhook
        settings:
          url: http://ntfy/homelab-alerts
          httpMethod: POST
